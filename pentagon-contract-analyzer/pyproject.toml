[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pentagon-contract-analyzer"
version = "0.1.0"
description = "Cross-reference Pentagon procurement data with commercial COTS pricing to identify overpriced contracts"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "jinja2>=3.1",
    "python-pptx>=0.6.23",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-mock", "responses>=0.24"]

[project.scripts]
pentagon-analyzer = "pentagon_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["pentagon_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
