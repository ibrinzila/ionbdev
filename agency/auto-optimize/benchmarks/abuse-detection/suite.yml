# Abuse Detection Benchmark Suite
# Tests the Abuse Prevention agent's classification accuracy

suite:
  name: abuse-detection
  version: "1.0.0"
  description: "Evaluate abuse detection precision, recall, and evidence quality"
  total_cases: 10

cases:
  - id: paypal-phish
    name: "PayPal phishing — letter substitution"
    input: { domain: "paypa1-secure", record: { CNAME: "phish.workers.dev" }, owner: { username: "anon99", contributions: 0, account_age_days: 3 } }
    expected: { classification: malicious, confidence: ">0.90", indicators: [brand_impersonation, character_substitution, new_account] }
    scoring: { classification: 0.4, confidence: 0.2, indicators: 0.3, evidence: 0.1 }

  - id: apple-phish
    name: "Apple phishing — homoglyph"
    input: { domain: "app1e-id-verify", record: { CNAME: "verify-host.pages.dev" }, owner: { username: "newuser2026", contributions: 0 } }
    expected: { classification: malicious, confidence: ">0.85" }
    scoring: { classification: 0.5, confidence: 0.2, indicators: 0.3 }

  - id: bulk-registration
    name: "Bulk registration abuse — 8 domains in 1 hour"
    input: { domains: ["site1", "site2", "site3", "site4", "site5", "site6", "site7", "site8"], owner: { username: "bulkuser", contributions: 0 }, time_window: "1h" }
    expected: { classification: suspicious, confidence: ">0.75", indicator: bulk_registration }
    scoring: { classification: 0.4, identifies_pattern: 0.4, appropriate_action: 0.2 }

  - id: legitimate-developer
    name: "Legitimate developer portfolio"
    input: { domain: "john-portfolio", record: { CNAME: "johndev.github.io" }, owner: { username: "johndev", contributions: 20, account_age_days: 500 } }
    expected: { classification: legitimate, confidence: ">0.85" }
    scoring: { classification: 0.5, avoids_false_positive: 0.3, reasoning: 0.2 }

  - id: legitimate-brand-fan
    name: "Legitimate fan project — not impersonation"
    input: { domain: "awesome-react-tools", record: { CNAME: "reactfan.github.io" }, owner: { username: "reactfan", contributions: 30, account_age_days: 800 } }
    expected: { classification: legitimate, confidence: ">0.80" }
    scoring: { classification: 0.5, avoids_false_positive: 0.3, reasoning: 0.2 }

  - id: google-typosquat
    name: "Google typosquat"
    input: { domain: "go0gle-login", record: { A: ["198.51.100.1"] }, owner: { username: "rando123", contributions: 0, account_age_days: 1 } }
    expected: { classification: malicious, confidence: ">0.90" }
    scoring: { classification: 0.5, confidence: 0.2, indicators: 0.3 }

  - id: microsoft-impersonation
    name: "Microsoft impersonation"
    input: { domain: "micr0soft-teams", record: { CNAME: "teams-login.workers.dev" }, owner: { username: "newaccount", contributions: 0 } }
    expected: { classification: malicious, confidence: ">0.85" }
    scoring: { classification: 0.5, confidence: 0.2, indicators: 0.3 }

  - id: legitimate-similar-name
    name: "Legitimate domain with brand-adjacent name"
    input: { domain: "msft-engineer-blog", record: { CNAME: "msft-engineer.github.io" }, owner: { username: "msft-engineer", contributions: 45, account_age_days: 1200 } }
    expected: { classification: legitimate }
    scoring: { classification: 0.5, avoids_false_positive: 0.3, considers_history: 0.2 }

  - id: suspicious-cname-target
    name: "Suspicious CNAME to known malicious host"
    input: { domain: "my-cool-site", record: { CNAME: "evil-host.example.evil" }, owner: { username: "newuser", contributions: 0 } }
    expected: { classification: suspicious, indicator: suspicious_target }
    scoring: { classification: 0.4, identifies_target: 0.4, appropriate_action: 0.2 }

  - id: dangling-cname
    name: "CNAME pointing to non-existent target"
    input: { domain: "old-project", record: { CNAME: "deleted-repo.github.io" }, owner: { username: "olduser", contributions: 5 } }
    expected: { classification: vulnerable, indicator: dangling_cname, risk: subdomain_takeover }
    scoring: { classification: 0.4, identifies_risk: 0.4, recommends_action: 0.2 }
